<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lilltjära hemapp</title>
<meta name="theme-color" content="#060a1b">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Lilltjära">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: phone-first app, one view at a time, swipe sideways between views. Night-blue canvas with thin glowing LED strips (cyan to violet to pink) as the one recurring motif, after a lit charging canopy on a winter night. Single dark theme by choice. */
:root{
  --bg:#060a1b; --surface:#0e1530; --surface-2:#161f42; --surface-3:#243160;
  --ink:#eaf1ff; --muted:#8f9dc6; --line:#1d2850;
  --accent:#2ccfff; --accent-ink:#03131f; --accent-soft:rgba(44,207,255,.15); --violet:#7f6dff; --pink:#ff4fb8;
  --ok:#3fe0a2; --warn:#ffc355; --bad:#ff6b80; --info:#6ea4ff; --snow:#a5dcff; --lamp:#ffd35e;
  --led:linear-gradient(90deg,var(--accent),var(--violet) 55%,var(--pink));
  --display:"Chakra Petch","Avenir Next","Segoe UI",system-ui,sans-serif;
  --body:"Manrope","Helvetica Neue","Segoe UI",system-ui,sans-serif;
  --r:20px; --r-sm:13px; --shadow:0 18px 40px -24px rgba(0,0,0,.9);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.4;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0;text-align:inherit}
a{color:inherit}
:focus-visible{outline:2px solid var(--info);outline-offset:2px;border-radius:8px}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance}
[hidden]{display:none!important}

/* shell */
.top{position:sticky;top:0;z-index:15;display:flex;align-items:center;gap:10px;padding:10px 16px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:700;font-size:18px;letter-spacing:-.01em;flex:1;min-width:0}
.brand .mark{width:30px;height:30px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;flex:none}
.status{display:flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);white-space:nowrap}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.ok{background:var(--ok)}.dot.bad{background:var(--bad)}.dot.warn{background:var(--warn)}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:var(--surface);border:1px solid var(--line);flex:none}
.iconbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
main{padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px));max-width:1280px;margin:0 auto}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;justify-content:space-around;padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.nav a{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;gap:2px;padding:5px 0 3px;border-radius:12px;text-decoration:none;color:var(--muted);font-size:10.5px;font-weight:600}
.nav a .ni{width:44px;height:28px;border-radius:14px;display:grid;place-items:center;transition:background .2s}
.nav a[aria-current="page"]{color:var(--ink)}
.nav a[aria-current="page"] .ni{background:var(--accent);color:var(--accent-ink)}
@media (min-width:900px){
  .nav{top:61px;right:auto;bottom:0;width:92px;flex-direction:column;justify-content:flex-start;gap:6px;padding:14px 8px;border-top:0;border-right:1px solid var(--line)}
  .nav a{flex:none;font-size:12px;padding:8px 0}
  main{margin-left:92px;padding:20px 24px 40px;max-width:1400px}
}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,330px),1fr));gap:14px;align-items:start}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.vt{font-size:26px;font-weight:700;letter-spacing:-.02em;margin:4px 0 12px}

/* cards */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0;box-shadow:var(--shadow)}
.ch{display:flex;align-items:center;gap:10px;margin-bottom:12px;min-height:30px}
.ch h2{font-size:17px;font-weight:600;flex:1;min-width:0}
.ch .ci{width:30px;height:30px;border-radius:10px;display:grid;place-items:center;flex:none;background:color-mix(in srgb,var(--c,var(--accent)) 16%,transparent);color:var(--c,var(--accent))}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);white-space:nowrap}
.pill.ok{background:color-mix(in srgb,var(--ok) 16%,transparent);color:var(--ok)}
.pill.warn{background:color-mix(in srgb,var(--warn) 18%,transparent);color:var(--warn)}
.pill.bad{background:color-mix(in srgb,var(--bad) 16%,transparent);color:var(--bad)}
.pill.info{background:color-mix(in srgb,var(--info) 16%,transparent);color:var(--info)}
.muted{color:var(--muted)}.small{font-size:13px}.xs{font-size:12px}
.big{font-family:var(--display);font-weight:700;font-size:44px;line-height:1;letter-spacing:-.03em}
.mid{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.05;letter-spacing:-.01em}
.unit{font-family:var(--body);font-size:14px;font-weight:500;color:var(--muted);margin-left:3px;letter-spacing:0}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.grow{flex:1;min-width:0}
.ellip{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(118px,1fr));gap:8px}
.tile{background:var(--surface-2);border-radius:var(--r-sm);padding:10px 12px;min-width:0}
.tile .k{font-size:12px;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:700;font-size:21px;margin-top:1px}
.tile .s{font-size:11.5px;color:var(--muted)}
.tile.warn{box-shadow:inset 0 0 0 1.5px var(--warn)}.tile.bad{box-shadow:inset 0 0 0 1.5px var(--bad)}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0;padding-top:0}.li:last-child{padding-bottom:0}
a.li{text-decoration:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 14px;border-radius:13px;background:var(--surface-2);font-weight:600;font-size:14px;min-height:44px;transition:transform .1s,background .15s;text-decoration:none}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad)}
.btn.busy{opacity:.5;pointer-events:none}
.btn.on{box-shadow:inset 0 0 0 2px var(--accent)}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btnrow .btn{flex:1 1 auto}
.quick{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.q{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:12px;border-radius:15px;background:var(--surface-2);font-weight:600;font-size:13.5px;min-height:78px;line-height:1.15}
.q .qi{width:32px;height:32px;border-radius:10px;display:grid;place-items:center;background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}
.q:active{transform:scale(.97)}.q.busy{opacity:.5}
.seg{display:flex;background:var(--surface-2);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;padding:7px 8px;border-radius:9px;font-size:13px;font-weight:600;color:var(--muted);min-height:36px;text-align:center;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.14)}
.banner{display:flex;gap:10px;align-items:flex-start;padding:12px 14px;border-radius:14px;background:color-mix(in srgb,var(--info) 12%,transparent);border:1px solid color-mix(in srgb,var(--info) 30%,transparent);margin-bottom:14px;font-size:14px}
.banner.warn{background:color-mix(in srgb,var(--warn) 12%,transparent);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.note{font-size:12px;color:var(--muted);margin-top:10px}
.sk{height:56px;border-radius:12px;background:linear-gradient(90deg,var(--surface-2),var(--surface-3),var(--surface-2));background-size:200% 100%;animation:sk 1.4s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
@media (prefers-reduced-motion:reduce){.sk,.iconbtn.busy svg,.disc.spin{animation:none!important}}

/* switch + sliders */
.sw{width:50px;height:30px;border-radius:999px;background:var(--surface-3);position:relative;flex:none;transition:background .2s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.3);transition:transform .2s}
.sw[aria-checked="true"]{background:var(--accent)}
.sw[aria-checked="true"]::after{transform:translateX(20px)}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:28px;background:transparent;margin:0;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:8px;border-radius:5px;background:linear-gradient(90deg,var(--tc,var(--accent)) var(--p,50%),var(--surface-3) var(--p,50%))}
input[type=range]::-moz-range-track{height:8px;border-radius:5px;background:linear-gradient(90deg,var(--tc,var(--accent)) var(--p,50%),var(--surface-3) var(--p,50%))}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:#fff;margin-top:-7px;box-shadow:0 1px 5px rgba(0,0,0,.35);border:1px solid rgba(0,0,0,.08)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border-radius:50%;background:#fff;border:1px solid rgba(0,0,0,.08)}
input.warmth::-webkit-slider-runnable-track{height:14px;border-radius:8px;background:linear-gradient(90deg,#cfe4ff,#fff3e0 45%,#ffb469)}
input.warmth::-moz-range-track{height:14px;border-radius:8px;background:linear-gradient(90deg,#cfe4ff,#fff3e0 45%,#ffb469)}
input.warmth::-webkit-slider-thumb{margin-top:-4px}

/* hero */
.hero{background:linear-gradient(150deg,var(--accent) 0%,color-mix(in srgb,var(--accent) 62%,#0a2a3a) 100%);color:#fff;border:0;position:relative;overflow:hidden}
.hero .muted{color:rgba(255,255,255,.78)}
.hero h1{font-size:25px;font-weight:700;letter-spacing:-.01em}
.hero .clock{font-family:var(--display);font-weight:600;font-size:56px;line-height:.95;letter-spacing:-.03em;margin-top:10px}
.hero .wxnow{display:flex;align-items:center;gap:10px;text-decoration:none;color:#fff}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 11px;border-radius:999px;background:rgba(255,255,255,.16);font-size:13px;font-weight:600;text-decoration:none;color:#fff;min-height:34px}

/* lights */
.lamp{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
.lamp:first-of-type{border-top:0}
.bulb{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;background:var(--surface-2);color:var(--muted);transition:background .2s,box-shadow .2s}
.lamp.on .bulb{background:var(--lc,var(--lamp));color:#2b2100;box-shadow:0 0 18px -4px var(--lc,var(--lamp))}
.lamp .nm{font-weight:600}
.lamp .sl{grid-column:2/-1;margin-top:-4px}
.lamp input[type=range]{--tc:var(--lc,var(--lamp))}
.more{min-height:36px;padding:6px 11px;border-radius:10px;background:var(--surface-2);font-size:12.5px;font-weight:600;display:inline-flex;align-items:center;gap:6px}
.more i{width:14px;height:14px;border-radius:50%;background:conic-gradient(#ff5b5b,#ffd23f,#4cd964,#34c8ff,#7a6bff,#ff5bd1,#ff5b5b);display:block}

/* sheet */
.scrim{position:fixed;inset:0;z-index:40;background:rgba(5,12,8,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.3);overscroll-behavior:contain}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:24px}}
.grab{width:42px;height:5px;border-radius:3px;background:var(--surface-3);margin:0 auto 12px}
.preview{height:74px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-weight:700;color:#221a00;margin:12px 0;transition:background .15s;background:var(--surface-2)}
.pad{position:relative;height:190px;border-radius:16px;touch-action:none;cursor:crosshair;background:linear-gradient(to bottom,rgba(255,255,255,0),#fff),linear-gradient(to right,hsl(0 100% 50%),hsl(60 100% 50%),hsl(120 100% 45%),hsl(180 100% 45%),hsl(240 100% 60%),hsl(300 100% 55%),hsl(360 100% 50%));box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.knob{position:absolute;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 2px 8px rgba(0,0,0,.45);transform:translate(-50%,-50%);pointer-events:none}
.swatches{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px}
.swatch{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11.5px;color:var(--muted);width:56px}
.swatch i{width:44px;height:44px;border-radius:50%;display:block;box-shadow:inset 0 0 0 1px rgba(0,0,0,.14)}
.lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:16px 0 6px}

/* climate */
.temps{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:8px}
.tt{border-radius:var(--r-sm);padding:10px 12px;background:var(--surface-2);border-left:4px solid var(--tc,var(--surface-3));min-width:0}
.stepper{display:flex;align-items:center;gap:12px}
.stepper button{width:44px;height:44px;border-radius:50%;background:var(--surface-2);font-size:22px;font-weight:600;display:grid;place-items:center}

/* media */
.np{display:grid;grid-template-columns:64px 1fr;gap:12px;align-items:center}
.disc{width:64px;height:64px;border-radius:50%;background:conic-gradient(from 0deg,var(--accent),#1c2b22,var(--accent),#1c2b22,var(--accent));display:grid;place-items:center}
.disc::after{content:"";width:18px;height:18px;border-radius:50%;background:var(--surface)}
.disc.spin{animation:spin 5s linear infinite}
.ctrl{display:flex;align-items:center;gap:8px}
.cb{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;background:var(--surface-2);flex:none}
.cb.main{background:var(--accent);color:var(--accent-ink);width:50px;height:50px}
.spk{padding:12px 0;border-top:1px solid var(--line)}
.spk:first-of-type{border-top:0;padding-top:0}
.favs{max-height:300px;overflow:auto;display:flex;flex-direction:column;gap:2px;overscroll-behavior:contain;margin-top:8px}
.fav{display:flex;align-items:center;gap:10px;padding:8px;border-radius:11px;min-height:46px;width:100%}
.fav:active{background:var(--surface-2)}
.fav .fi{width:32px;height:32px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent);flex:none}

/* machines */
.mimg{display:block;width:100%;max-width:420px;height:auto;margin:-2px auto 8px;filter:drop-shadow(0 12px 14px rgba(0,0,0,.28))}
.bar{height:9px;border-radius:5px;background:var(--surface-3);overflow:hidden}
.bar i{display:block;height:100%;border-radius:5px;background:var(--bc,var(--accent));transition:width .4s}

/* weather */
.hours{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.hours::-webkit-scrollbar{display:none}
.hr{flex:none;width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;padding:9px 0;border-radius:13px;background:var(--surface-2);font-size:12.5px}
.hr b{font-size:15px}.hr .pp{color:var(--snow);font-size:11.5px;min-height:15px;font-weight:600}
.day{display:grid;grid-template-columns:52px 28px 1fr 34px 76px 34px;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.day:first-child{border-top:0}
.range{height:7px;border-radius:4px;background:var(--surface-3);position:relative}
.range i{position:absolute;top:0;bottom:0;border-radius:4px;background:linear-gradient(90deg,#5aa9ff,#ffc04d)}
.rank{display:grid;grid-template-columns:22px minmax(0,1fr) auto;gap:2px 10px;align-items:center;padding:8px 0;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .rn{font-family:var(--display);font-weight:700;color:var(--muted);text-align:center}
.rank .rb{grid-column:2/-1;height:7px;border-radius:4px;background:var(--surface-3);overflow:hidden}
.rank .rb i{display:block;height:100%;border-radius:4px;background:var(--snow)}
.rank.me .rn{color:var(--accent)}
.tag{font-size:10.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--snow);margin-left:6px}

/* sport */
.bajen{background:linear-gradient(160deg,#0b6e3c,#0b3d26 60%,#0d2219);color:#fff;border:0;position:relative;overflow:hidden;padding-bottom:24px}
.bajen::after{content:"";position:absolute;left:0;right:0;bottom:0;height:7px;background:repeating-linear-gradient(90deg,#14a35b 0 26px,#f4f7f5 26px 52px)}
.bajen .muted{color:#cdeedd}.bajen .ci{background:rgba(255,255,255,.16);color:#fff}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:10px;align-items:center;text-align:center}
.crest{width:46px;height:46px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);margin:0 auto 6px}
.crest.me{background:#14a35b;border-color:#fff}
.score{font-family:var(--display);font-weight:700;font-size:38px;line-height:1}
.live{display:inline-block;background:#e11d48;color:#fff;font-weight:800;font-size:11px;letter-spacing:.08em;border-radius:6px;padding:3px 8px}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:13.5px}
th{font-size:11px;color:var(--muted);font-weight:600;text-align:right;padding:6px 5px}
td{padding:7px 5px;border-top:1px solid var(--line);text-align:right;white-space:nowrap}
th:nth-child(2),td:nth-child(2){text-align:left}
th:first-child,td:first-child{text-align:left;color:var(--muted);width:26px}
tr.me td{background:color-mix(in srgb,var(--hl,var(--accent)) 16%,transparent);font-weight:700}
tr.me td:first-child{box-shadow:inset 3px 0 0 var(--hl,var(--accent));color:var(--ink)}
details summary{cursor:pointer;font-weight:600;padding:8px 0;list-style:none;display:flex;align-items:center;gap:6px;color:var(--accent);min-height:40px}
details summary::-webkit-details-marker{display:none}

.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom,0px));transform:translate(-50%,16px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:13px;font-weight:600;font-size:14px;z-index:60;transition:all .22s;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ---- night + LED treatment ---- */
html{background:var(--bg)}
body{background:radial-gradient(900px 520px at 88% -8%,rgba(127,109,255,.26),transparent 62%),radial-gradient(760px 460px at -12% 34%,rgba(44,207,255,.13),transparent 60%),radial-gradient(700px 500px at 60% 110%,rgba(255,79,184,.10),transparent 60%),var(--bg);background-attachment:fixed;min-height:100vh;overflow-x:hidden}
.top{background:rgba(6,10,27,.82);border-bottom:0;padding-bottom:14px}
.brand{letter-spacing:.02em;text-transform:lowercase;font-size:20px}
.brand .mark{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent),0 0 16px -2px var(--accent)}
.led{position:absolute;left:16px;right:16px;bottom:3px;height:10px;display:flex;gap:5px;align-items:center;text-decoration:none}

function bindPad(pad, id){
  const move = (e, fin) => {
    const r = pad.getBoundingClientRect(), x = clamp((e.clientX-r.left)/r.width,0,1), y = clamp((e.clientY-r.top)/r.height,0,1);
    const hue = Math.round(x*1000)/1000, sat = Math.round((1-y)*1000)/1000, css = hsCss(hue, sat), k = $("#knob"), pv = $("#pv");
    if (k){ k.style.left = (x*100)+"%"; k.style.top = (y*100)+"%"; k.style.background = css; }
    if (pv){ pv.style.background = css; pv.textContent = ""; }
    queueCaps(id, {onoff:true, light_mode:"color", light_hue:hue, light_saturation:sat}, fin);
  };
  pad.addEventListener("pointerdown", e => { S.dragging = true; try { pad.setPointerCapture(e.pointerId); } catch(_){} move(e); });
  pad.addEventListener("pointermove", e => { if (S.dragging && e.buttons !== 0) move(e); });
  const end = e => { if (!S.dragging) return; move(e, true); S.dragging = false; render(); };
  pad.addEventListener("pointerup", end); pad.addEventListener("pointercancel", () => { S.dragging = false; });
}

  const trouble = ["alarm_generic","alarm_fire","alarm_water","alarm_co","alarm_tamper"].filter(k => s[k] === true);
  return {state, label:{armed:"Larmat", disarmed:"Avlarmat", partially_armed:"Nattläge"}[state] || "Okänt", cls: trouble.length?"bad":state==="armed"?"ok":state==="partially_armed"?"info":"warn", trouble, s};
}

function alerts(){
  const out = [], add = (cls, text, href) => out.push({cls, text, href});

  const so = (dev(DEV.solar)||{}).state; if (so && (so.alarm_problem || so.alarm_connectivity)) add("warn", "Växelriktaren för solcellerna rapporterar problem", "#hem");
  const se = (dev(DEV.sensibo)||{}).state; if (se && se.alarm_filter) add("warn", "Luftvärmepumpens filter behöver rengöras", "#klimat");

  return out;
}
